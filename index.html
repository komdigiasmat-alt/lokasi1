<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peta BTS Telkomsel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore/leaflet-omnivore.min.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .leaflet-tooltip {
      background-color: white;
      border: 1px solid #d32f2f;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 12px;
      color: #d32f2f;
      font-weight: bold;
      box-shadow: 0 0 3px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Inisialisasi peta
    var map = L.map('map').setView([-5.5, 138.5], 9);

    // Layer dasar (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // URL file KML di GitHub
    var kmlUrl = 'https://rawcdn.githack.com/komdigiasmat-alt/lokasi1/main/Untitled%20map.kml';

    // Ikon tower BTS (ikon merah, transparan latar belakang)
    var towerIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/484/484167.png', // ikon tower BTS
      iconSize: [36, 36],
      iconAnchor: [18, 36],
      popupAnchor: [0, -30]
    });

    // Muat file KML
    omnivore.kml(kmlUrl)
      .on('ready', function() {
        map.fitBounds(this.getBounds());
      })
      .on('layeradd', function(e) {
        var layer = e.layer;
        if (layer.feature && layer.feature.properties && layer.feature.properties.name) {
          var latlng = layer.getLatLng ? layer.getLatLng() : null;
          if (latlng) {
            // Hapus marker default
            map.removeLayer(layer);
            // Tambah marker baru dengan ikon tower BTS dan label nama
            var marker = L.marker(latlng, { icon: towerIcon }).addTo(map);
            marker.bindTooltip(layer.feature.properties.name, {
              permanent: true,
              direction: 'top',
              offset: [0, -10]
            }).openTooltip();
          }
        }
      })
      .addTo(map);
  </script>
</body>
</html>
