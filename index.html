<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peta BTS Telkomsel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore/leaflet-omnivore.min.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .leaflet-tooltip {
      background-color: white;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Inisialisasi peta
    var map = L.map('map').setView([-5.5, 138.5], 9);

    // Tambahkan layer dasar
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // URL file KML kamu
    var kmlUrl = 'https://rawcdn.githack.com/komdigiasmat-alt/lokasi1/main/Untitled%20map.kml';

    // Ikon menara BTS
    var towerIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3097/3097144.png',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -25]
    });

    // Muat file KML
    omnivore.kml(kmlUrl)
      .on('ready', function() {
        map.fitBounds(this.getBounds());
      })
      .on('layeradd', function(e) {
        var layer = e.layer;
        if (layer.feature && layer.feature.properties && layer.feature.properties.name) {
          var latlng = layer.getLatLng ? layer.getLatLng() : null;
          if (latlng) {
            // Hapus marker lama
            map.removeLayer(layer);
            // Tambah marker baru dengan ikon tower dan label
            var marker = L.marker(latlng, { icon: towerIcon }).addTo(map);
            marker.bindTooltip(layer.feature.properties.name, {
              permanent: true,
              direction: 'top',
              offset: [0, -10]
            }).openTooltip();
          }
        }
      })
      .addTo(map);
  </script>
</body>
</html>
