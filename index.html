<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peta Lokasi 1</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore/leaflet-omnivore.min.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .leaflet-popup-content { font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Inisialisasi peta
    var map = L.map('map').setView([-4.5, 138.5], 8);

    // Tambahkan peta dasar (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Link file KML kamu (pastikan nama & huruf besar kecilnya tepat!)
    var kmlUrl = 'https://rawcdn.githack.com/komdigiasmat-alt/lokasi1/main/Untitled%20map.kml';

    // Muat KML
    var kmlLayer = omnivore.kml(kmlUrl, null, L.geoJson(null, {
      onEachFeature: function(feature, layer) {
        // Coba ambil nama dari feature.properties.name
        var popupText = feature.properties.name || '';
        // Kalau tidak ada, coba ambil dari feature.properties.description
        if (!popupText && feature.properties.description) {
          popupText = feature.properties.description;
        }
        // Tampilkan popup kalau ada nama
        if (popupText) {
          layer.bindPopup(popupText);
        }
      }
    }));

    kmlLayer.on('ready', function() {
      map.fitBounds(kmlLayer.getBounds());
    }).addTo(map);
  </script>
</body>
</html>
